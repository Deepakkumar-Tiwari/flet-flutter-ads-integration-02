[project]
name = "flet-ads-ext-example"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet-ads-ext @ file:///home/dpkmanjaro/Desktop/data/git/flet-flutter-ads-integration-02/",
    "flet>=0.80.3",
]

[dependency-groups]
dev = [
    "flet-cli>=0.80.3",
    "flet-desktop-light>=0.80.3",
    "flet-web>=0.80.3",
]

[tool.flet]
# org name in reverse domain name notation, e.g. "com.mycompany".
# Combined with project.name to build bundle ID for iOS and Android apps
org = "com.mycompany"

# project display name that is used as an app title on Android and iOS home screens,
# shown in window titles and about app dialogs on desktop.
product = "flet-ads-ext-example"

# company name to display in about app dialogs
company = "Flet"

# copyright text to display in about app dialogs
copyright = "Copyright (C) 2026 by MyCompany"

[tool.flet.app]
path = "src"

[tool.flet.dev_packages]
flet-ads-ext = "../.." # relative path

[tool.uv.sources]
flet-ads-ext = { path = "../../", editable = true }

[tool.flet.android.meta_data] # # MANDATORY with flet-ads: This is how Android knows which AdMob account to bill
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-3940256099942544~3347511713" # ***11713 is test id. Note the " in name. 